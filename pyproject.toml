[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "litdiscovery"
version = "0.1.0"
description = "科研文献信息提取驱动科研发现 agent（Literature-driven Discovery）"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pandas",
    "pydantic",
    "tiktoken",
    "pyyaml",
    "langchain-core",
    "langchain-openai",
    "langgraph",
]

[project.optional-dependencies]
pdf = ["docling"]
test = ["pytest"]

[project.scripts]
litdiscovery = "litdiscovery.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["litdiscovery*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
